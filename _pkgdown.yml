url: https://pursuitofdatascience.github.io/tidycjk/
template:
  bootstrap: 5
  light-switch: true
  bslib:
    primary: "#1D3A61"
    link-color: "#C2412F"
    border-radius: "0.5rem"
    btn-border-radius: "0.5rem"
    headings-font-weight: 600

development:
  mode: release

authors:
  Youzhi Yu:
    href: https://youzhi.netlify.app/
  footer:
    text: "Crafted by"
  sidebar:
    roles: [aut, cre]

home:
  sidebar:
    structure: [links, license, community, citation, authors, dev]

reference:
- title: Summarise a text column
  desc: >
    Verbs taking `(data, column)` and returning a tibble, for a dplyr pipeline.
  contents:
  - cjk_summary
  - cjk_char_counts
  - cjk_tokens
- title: Segment
  desc: >
    Splitting CJK text into words. Where a word ends is a fact about a
    language rather than about Unicode, so the engine is a required,
    pluggable choice. Dictionary-based segmentation for Chinese and Japanese
    ships via ICU; further engines can be registered.
  contents:
  - cjk_segment
  - cjk_segmenters
  - register_cjk_segmenter
- title: Sentences and n-grams
  desc: >
    Preprocessing that generic tooling gets wrong on CJK: sentence
    terminators are U+3002, U+FF01 and U+FF1F rather than ".!?", and
    character n-grams are the dictionary-free baseline for Chinese.
  contents:
  - cjk_sentences
  - cjk_ngrams
- title: Order
  desc: >
    ICU collation. R's sort() puts Han in code point order, which is not
    pronunciation, stroke or frequency.
  contents:
  - cjk_sort
- title: Detect & classify
  contents:
  - has_cjk
  - cjk_script
  - cjk_detect_language
  - cjk_ratio
- title: Display width
  desc: >
    Terminal columns rather than characters, so CJK tables line up.
  contents:
  - cjk_width
  - cjk_pad
  - cjk_truncate
  - cjk_wrap
- title: Normalise width variants
  contents:
  - to_halfwidth
  - to_fullwidth
- title: Transliterate
  desc: >
    Romanisation, Han script conversion, the kana syllabaries and Hangul
    jamo. Each help page states how far it can be trusted: kana conversion
    is a normalisation, the jamo round trip returns NFC, Han conversion
    resolves ambiguity from context but not regional vocabulary, and
    romanisation reads all Han as Chinese.
  contents:
  - cjk_romanize
  - cjk_simplify
  - to_hiragana
  - cjk_jamo
- title: Reference data
  contents:
  - cjk_blocks
- title: Package
  contents:
  - tidycjk-package

navbar:
  type: default
  left:
  - text: Reference
    href: reference/index.html
  - text: Articles
    menu:
    - text: Introduction to tidycjk
      href: articles/tidycjk.html
    - text: Segmenting CJK text
      href: articles/segmentation.html
    - text: Width, padding, truncation and wrapping
      href: articles/width-and-layout.html
    - text: Romanisation, script conversion and kana
      href: articles/transliteration.html
    - text: '---'
    - text: A visual tour
      href: articles/gallery.html
  - text: News
    href: news/index.html
  right:
  - icon: fa-github fa-lg
    href: https://github.com/PursuitOfDataScience/tidycjk
